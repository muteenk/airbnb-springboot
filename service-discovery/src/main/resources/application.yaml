spring:
  application:
    name: service-discovery

server:
  port: 8761 # The standard and default port for Eureka Server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

logging:
  file:
    name: logs/service-discovery.log
  level:
    root: INFO
    com.airbnb.service_discovery: INFO