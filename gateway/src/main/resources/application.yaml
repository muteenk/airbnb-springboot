server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-oauth
              uri: lb://user-service
              predicates:
                - Path=/oauth2/**,/login/oauth2/**

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/users/**
              filters:
                - StripPrefix=1

            - id: property-service
              uri: lb://property-service
              predicates:
                - Path=/properties/**
              filters:
                - StripPrefix=1

            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/bookings/**
              filters:
                - StripPrefix=1

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/payments/**
              filters:
                - StripPrefix=1

app:
  jwt:
    secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
