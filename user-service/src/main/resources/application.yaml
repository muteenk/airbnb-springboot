spring:
  application:
    name: user-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
            scope: openid, profile, email
            # Must go through the gateway with localhost — Google rejects private LAN IPs (10.x/192.168.x)
            redirect-uri: "http://localhost:8080/login/oauth2/code/{registrationId}"
          github:
            client-id: ${GH_CLIENT_ID}
            client-secret: ${GH_CLIENT_SECRET}
            scope: read:user, user:email
            redirect-uri: "http://localhost:8080/login/oauth2/code/{registrationId}"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

logging:
  file:
    name: logs/user-service.log
  level:
    root: INFO
    com.airbnb.user_service: INFO

server:
  port: 8081

app:
  gateway-base-url: http://localhost:8080
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 900
    refresh-token-expiry: 604800
